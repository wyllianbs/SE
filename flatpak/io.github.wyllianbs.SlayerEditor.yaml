# Manifesto Flatpak do Slayer Editor (Flathub).
# As ferramentas do usuário (shell, compiladores, gdb, LSP) rodam no HOSPEDEIRO
# via flatpak-spawn --host; por isso é preciso --talk-name=org.freedesktop.Flatpak.
app-id: io.github.wyllianbs.SlayerEditor
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
command: slayer-editor

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network                       # alguns servidores LSP/ferramentas usam rede
  - --filesystem=host                      # editar arquivos em qualquer lugar (IDE)
  - --talk-name=org.freedesktop.Flatpak    # flatpak-spawn --host

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /lib/*.a
  - /share/man
  - '*.la'

modules:
  - name: utf8proc
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=ON
      - -DUTF8PROC_ENABLE_TESTING=OFF
    sources:
      - type: archive
        url: https://github.com/JuliaStrings/utf8proc/archive/refs/tags/v2.9.0.tar.gz
        sha256: 18c1626e9fc5a2e192311e36b3010bfc698078f692888940f1fa150547abb0c1

  - name: lxqt-build-tools
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: archive
        url: https://github.com/lxqt/lxqt-build-tools/releases/download/2.1.0/lxqt-build-tools-2.1.0.tar.xz
        sha256: 2458b629936f5e1ff8850e9953e49d66b96ac419cb484fed0a4d28a711fd8ef9

  - name: qtermwidget
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_EXAMPLE=OFF
      - -DBUILD_TESTING=OFF
    sources:
      - type: archive
        url: https://github.com/lxqt/qtermwidget/releases/download/2.1.0/qtermwidget-2.1.0.tar.xz
        sha256: 26ecb2c3a38de10db3b5ae24970957a33520f7742e3ae1ff93d345ded2be8e4b

  - name: slayer-editor
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
    sources:
      # Flathub: fonte pública com commit fixo. Para testar localmente, troque
      # por:  - type: dir
      #         path: ..
      - type: git
        url: https://github.com/wyllianbs/SlayerEditor-Linux.git
        tag: v0.3.0
        commit: c38dc393dc54488db393d34668750bfae7de201a
